name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      # install.sh downloads v<manifest version>: a tag that disagrees with the
      # manifest would publish binaries nobody can install.
      - name: Check tag matches manifest version
        run: |
          v=$(sed -n 's/^version *= *"\(.*\)".*/\1/p' herdr-plugin.toml | head -n 1)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match herdr-plugin.toml version v$v"
            exit 1
          fi
      - name: Extract release notes
        # A beta tag has no section of its own yet: it ships what is under [Unreleased].
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in *-*) version=Unreleased ;; esac
          make release-notes VERSION="$version" > "$RUNNER_TEMP/notes.md"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
